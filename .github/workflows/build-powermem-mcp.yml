name: Build powermem-mcp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build
        working-directory: src/powermem_mcp_server
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powermem-mcp-dist
          path: src/powermem_mcp_server/dist/
          retention-days: 30

  test-install:
    name: Test wheel installation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: powermem-mcp-dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel
        run: |
          pip install --no-cache-dir dist/*.whl
          echo "✓ Installation succeeded"

      - name: Verify import
        run: python -c "import powermem_mcp; print('✓ Import succeeded')"
